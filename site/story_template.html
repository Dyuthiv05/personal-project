<style>
/* Layout: a single reading column of numbered "slides", each with its time budget; charts sit full-width in the column */
:root {
  --bg: #fbfcfd; --panel: #ffffff; --ink: #0f1720; --ink2: #4a5563; --muted: #7d8794; --line: #e3e7ec; --axis: #c6ccd4;
  --accent: #2a78d6; --accent-soft: #e8f1fc;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #c3c2b7;
  --good: #0e7a43; --warn: #b4560f;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1318; --panel: #161b22; --ink: #eef1f4; --ink2: #b8c0ca; --muted: #8a94a1; --line: #262d36; --axis: #3a434e;
  --accent: #5598e7; --accent-soft: #17263a; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #5b5f66;
  --good: #3fbf7a; --warn: #f0965a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1318; --panel: #161b22; --ink: #eef1f4; --ink2: #b8c0ca; --muted: #8a94a1; --line: #262d36; --axis: #3a434e;
  --accent: #5598e7; --accent-soft: #17263a; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #5b5f66;
  --good: #3fbf7a; --warn: #f0965a; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 16.5px/1.6 var(--sans); }
.wrap { max-width: 920px; margin: 0 auto; padding-block: 48px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--serif); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(34px, 6vw, 52px); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: clamp(24px, 3.6vw, 31px); font-weight: 700; }
h3 { font-size: 18px; font-weight: 600; }
p { margin: 0; max-width: 66ch; }
.mono { font-family: var(--mono); }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.lede { font-size: 19px; color: var(--ink2); }
.num { font-variant-numeric: tabular-nums; }

header.hero { display: grid; gap: 18px; padding-bottom: 36px; border-bottom: 1px solid var(--line); }
.opener { border-left: 3px solid var(--accent); padding: 4px 0 4px 18px; font-family: var(--serif); font-size: 21px; line-height: 1.45; max-width: 60ch; }
.opener small { display: block; font: 400 13px var(--sans); color: var(--muted); margin-top: 6px; }
.agenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; color: var(--ink2); }
.agenda a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--axis); }
.agenda a:hover { color: var(--accent); }

section.slide { display: grid; gap: 18px; padding-block: 44px; border-bottom: 1px solid var(--line); min-width: 0; }
.slide-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.time { font: 500 12px/1 var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px; white-space: nowrap; }
.say { background: var(--accent-soft); border-radius: 10px; padding: 14px 18px; font-size: 15.5px; }
.say b { color: var(--accent); }
.how { font-size: 14.5px; color: var(--ink2); display: grid; gap: 6px; }
.how ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
.tile .v { font: 700 30px/1.1 var(--serif); }
.tile .l { font-size: 13.5px; color: var(--ink2); }

.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 10px; display: grid; gap: 8px; min-width: 0; }
.chart h3 { font-size: 16px; }
.chart .sub { font-size: 13px; color: var(--muted); }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

svg text { font-family: var(--sans); }
.ax { fill: var(--muted); font-size: 11px; }
.lbl { fill: var(--ink2); font-size: 12px; }
.val { fill: var(--ink); font-size: 12px; font-variant-numeric: tabular-nums; }
.gridl { stroke: var(--line); stroke-width: 1; }
.base { stroke: var(--axis); stroke-width: 1; }
.ref { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
.hit { fill: transparent; cursor: default; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 12px; text-align: left; border-top: 1px solid var(--line); vertical-align: top; }
thead th { border-top: 0; font: 500 11px/1.2 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.best td { font-weight: 600; }
.chip { font: 500 11px/1 var(--mono); padding: 4px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }

.reco { display: grid; gap: 12px; }
.reco-item { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; }
.reco-item .k { font: 700 22px/1.1 var(--serif); color: var(--accent); }
.reco-item div { display: grid; gap: 4px; }
.limits { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.limits > div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; font-size: 14.5px; }
.limits ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
footer { padding-top: 28px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }

.stat-src { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.issue { display: grid; gap: 10px; }
.issue-q { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 12px; }
.issue-q .k { grid-row: span 3; font: 700 22px/1.1 var(--serif); color: var(--accent); }
.issue-q .m { font-size: 14px; color: var(--ink2); }
.issue-q .m b { color: var(--ink); font-weight: 600; }
.refs { font-size: 13px; color: var(--muted); display: grid; gap: 3px; }
.refs ol { margin: 0; padding-left: 20px; display: grid; gap: 3px; }




.callout { border-radius: 12px; padding: 18px 20px; display: grid; gap: 8px; background: var(--accent-soft); border: 1px solid var(--line); }
.callout .t { font: 500 11.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.callout p { font-family: var(--serif); font-size: 20px; line-height: 1.45; max-width: 62ch; }
.callout.plain { background: var(--panel); }
.callout.plain p { font-family: var(--sans); font-size: 16px; }
.verdict { font: 600 11px/1 var(--mono); padding: 4px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--good); white-space: nowrap; }
.verdict.no { color: var(--warn); }
#tip { position: fixed; pointer-events: none; z-index: 20; background: var(--ink); color: var(--bg); font-size: 12.5px; line-height: 1.4;
  padding: 7px 10px; border-radius: 6px; max-width: 260px; opacity: 0; transition: opacity .1s; }
#tip b { font-weight: 700; }
a { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { #tip { transition: none; } }
</style>

<!--
  Renderer only. Every word, number and chart dataset on this page comes from
  notebooks/07_build_presentation.ipynb, which injects them as the PAGE object below.
  This file decides layout and how charts are drawn, nothing else.

<div class="wrap" id="page"></div>
<div id="tip" role="tooltip"></div>

<script>
const PAGE = /*__PAGE__*/{};
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const fmt = (v, d = 0) => Number(v).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
/* Number format spec from the notebook: {d, prefix, suffix, div} */
const F = (v, s = {}) => s.plain ? String(v) : (v < 0 ? "−" : "") + (s.prefix ?? "") + fmt(Math.abs(v) / (s.div ?? 1), s.d ?? 0) + (s.suffix ?? "");   // plain: years, no separators
const col = c => c && c.startsWith("s") && c.length === 2 ? `var(--${c})` : c;

const tip = $("#tip");
function showTip(e, html) { tip.innerHTML = html; tip.style.opacity = 1; tip.style.left = Math.min(e.clientX + 14, innerWidth - 270) + "px"; tip.style.top = (e.clientY + 14) + "px"; }
function hideTip() { tip.style.opacity = 0; }
function el(tag, attrs = {}, parent) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }

/* ---------- charts ---------- */
function hbars(svg, rows, o) {
  const W = 620, lw = o.labelW ?? 190, rh = o.rowH ?? 30, top = 6, H = top + rows.length * rh + 22;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const max = o.max, x = v => lw + (W - lw - 60) * v / max;
  o.ticks.forEach(t => { el("line", { x1: x(t), x2: x(t), y1: top, y2: H - 20, class: "gridl" }, svg); txt(svg, x(t), H - 6, F(t, o.tickFmt), "ax", { "text-anchor": "middle" }); });
  rows.forEach((r, i) => {
    const y = top + i * rh, bh = Math.min(16, rh - 10), w = Math.max(3, x(r.value) - lw);
    txt(svg, lw - 10, y + rh / 2 + 4, r.label, "lbl", { "text-anchor": "end" });
    el("path", { d: `M${lw},${y + (rh - bh) / 2} h${w - 3} a3,3 0 0 1 3,3 v${bh - 6} a3,3 0 0 1 -3,3 h${-(w - 3)} z`, fill: col(r.color ?? "s1") }, svg);
    txt(svg, lw + w + 6, y + rh / 2 + 4, F(r.value, o.valFmt), "val");
    hover(el("rect", { x: 0, y, width: W, height: rh, class: "hit" }, svg), r.tip);
  });
  if (o.ref != null) el("line", { x1: x(o.ref), x2: x(o.ref), y1: top - 2, y2: H - 20, class: "ref" }, svg);

}
function pairbars(svg, rows, o) {
  const W = 620, lw = 190, rh = 40, top = 4, H = top + rows.length * rh + 22;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const x = v => lw + (W - lw - 60) * v / o.max;
  o.ticks.forEach(t => { el("line", { x1: x(t), x2: x(t), y1: top, y2: H - 20, class: "gridl" }, svg); txt(svg, x(t), H - 6, F(t, o.tickFmt), "ax", { "text-anchor": "middle" }); });
  rows.forEach((r, i) => {
    const y = top + i * rh;
    txt(svg, lw - 10, y + rh / 2 + 4, r.label, "lbl", { "text-anchor": "end" });
    r.values.forEach((v, j) => {
      const yy = y + 6 + j * 14, w = Math.max(1.5, x(v) - lw);
      el("rect", { x: lw, y: yy, width: w, height: 12, rx: 2, fill: col(o.colors[j]) }, svg);
      if (v > 0) txt(svg, lw + w + 5, yy + 10, F(v, o.valFmt), "ax");
    });
    hover(el("rect", { x: 0, y, width: W, height: rh, class: "hit" }, svg), r.tip);
  });
  el("line", { x1: lw, x2: lw, y1: top, y2: H - 20, class: "base" }, svg);
}
function lines(svg, series, o) {
  const W = 620, H = o.H ?? 260, L = 44, R = 70, T = 12, B = 28;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const xs = series[0].pts.map(p => p[0]), xmin = Math.min(...xs), xmax = Math.max(...xs);
  const X = v => L + (W - L - R) * (v - xmin) / (xmax - xmin), Y = v => T + (H - T - B) * (1 - v / o.ymax);
  o.yticks.forEach(t => { el("line", { x1: L, x2: W - R, y1: Y(t), y2: Y(t), class: "gridl" }, svg); txt(svg, L - 8, Y(t) + 4, F(t, o.yFmt), "ax", { "text-anchor": "end" }); });
  (o.xticks ?? xs).forEach(t => txt(svg, X(t), H - 8, F(t, o.xFmt), "ax", { "text-anchor": "middle" }));
  el("line", { x1: L, x2: W - R, y1: Y(0), y2: Y(0), class: "base" }, svg);
  if (o.diag) el("line", { x1: X(xmin), y1: Y(0), x2: X(xmax), y2: Y(o.ymax), class: "ref" }, svg);
  series.forEach(s => {
    el("path", { d: s.pts.map((p, i) => (i ? "L" : "M") + X(p[0]) + "," + Y(p[1])).join(""), fill: "none", stroke: col(s.color), "stroke-width": 2.2, "stroke-linejoin": "round" }, svg);
    if (!o.noDots) s.pts.forEach(p => el("circle", { cx: X(p[0]), cy: Y(p[1]), r: 4, fill: col(s.color), stroke: "var(--panel)", "stroke-width": 2 }, svg));
    if (s.end) { const p = s.pts.at(-1); txt(svg, X(p[0]) + 8, Y(p[1]) + 4, s.end, "val"); }
  });
  (o.marks ?? []).forEach(m => { el("circle", { cx: X(m.x), cy: Y(m.y), r: 5, fill: col(m.color ?? "s2"), stroke: "var(--panel)", "stroke-width": 2 }, svg); txt(svg, X(m.x) + 10, Y(m.y) + 16, m.label, "val"); });
  const cross = el("line", { y1: T, y2: H - B, class: "ref", opacity: 0 }, svg);
  const hit = el("rect", { x: L, y: T, width: W - L - R, height: H - T - B, class: "hit" }, svg);
  hit.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect(), vx = xmin + (xmax - xmin) * (((e.clientX - r.left) * W / r.width) - L) / (W - L - R);
    const pts = series.map(s => s.pts.reduce((a, b) => Math.abs(b[0] - vx) < Math.abs(a[0] - vx) ? b : a));
    cross.setAttribute("x1", X(pts[0][0])); cross.setAttribute("x2", X(pts[0][0])); cross.setAttribute("opacity", 1);
    showTip(e, `<b>${F(pts[0][0], o.xFmt)}</b>` + series.map((s, i) => `<br>${s.name}: ${F(pts[i][1], o.tipFmt)}`).join(""));
  });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("opacity", 0); hideTip(); });
}
function hgroup(svg, rows, o) {
  const W = 620, lw = o.labelW ?? 150, n = o.names.length, bh = 11, rh = n * (bh + 3) + 14, top = 4, H = top + rows.length * rh + 24;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const [lo, hi] = o.dom, x = v => lw + (W - lw - 70) * (v - lo) / (hi - lo);
  o.ticks.forEach(t => { el("line", { x1: x(t), x2: x(t), y1: top, y2: H - 22, class: t === 0 ? "base" : "gridl" }, svg); txt(svg, x(t), H - 8, F(t, o.tickFmt), "ax", { "text-anchor": "middle" }); });
  rows.forEach((r, i) => {
    const y = top + i * rh;
    txt(svg, lw - 10, y + rh / 2 + 2, r.label, "lbl", { "text-anchor": "end" });
    r.values.forEach((v, j) => {
      const yy = y + 6 + j * (bh + 3), x0 = x(Math.min(0, v)), w = Math.max(1.5, Math.abs(x(v) - x(0)));
      el("rect", { x: x0, y: yy, width: w, height: bh, rx: 2, fill: col(o.colors[j]) }, svg);
      txt(svg, v >= 0 ? x(v) + 5 : x(v) - 5, yy + 9, F(v, o.valFmt), "ax", { "text-anchor": v >= 0 ? "start" : "end" });
    });
    hover(el("rect", { x: 0, y, width: W, height: rh, class: "hit" }, svg), r.tip);
  });
}
function tornado(svg, rows, o) {
  const W = 620, lw = o.labelW ?? 230, rh = 34, top = 18, H = top + rows.length * rh + 24;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const [lo, hi] = o.dom, x = v => lw + (W - lw - 20) * (v - lo) / (hi - lo);
  o.ticks.forEach(t => { el("line", { x1: x(t), x2: x(t), y1: top, y2: H - 22, class: t === 0 ? "base" : "gridl" }, svg); txt(svg, x(t), H - 8, F(t, o.tickFmt), "ax", { "text-anchor": "middle" }); });
  el("line", { x1: x(o.base), x2: x(o.base), y1: top - 10, y2: H - 22, class: "ref" }, svg);
  txt(svg, x(o.base), top - 12, "base case " + F(o.base, o.tickFmt), "ax", { "text-anchor": "middle" });
  rows.forEach((r, i) => {
    const y = top + i * rh, a = Math.min(r.low, r.high), b = Math.max(r.low, r.high);
    txt(svg, lw - 10, y + rh / 2 + 4, r.label, "lbl", { "text-anchor": "end" });
    el("rect", { x: x(a), y: y + 8, width: Math.max(2, x(b) - x(a)), height: rh - 16, rx: 3, fill: col(a < 0 ? "s2" : "s1"), "fill-opacity": 0.85 }, svg);
    txt(svg, x(a) - 5, y + rh / 2 + 4, F(r.low, o.tickFmt), "ax", { "text-anchor": "end" });
    txt(svg, x(b) + 5, y + rh / 2 + 4, F(r.high, o.tickFmt), "ax");
    hover(el("rect", { x: 0, y, width: W, height: rh, class: "hit" }, svg), r.tip);
  });
}
const CHARTS = { hbars, pairbars, lines, hgroup, tornado };

/* ---------- blocks ---------- */
const legend = items => items ? `<div class="legend">${items.map(i => `<span><i style="background:${col(i.color)}"></i>${i.label}</span>`).join("")}</div>` : "";
function tableHTML(b) {
  return `<div class="tbl-wrap"><table class="${b.dense ? "data" : ""}"><thead><tr>${b.columns.map(c => `<th class="${c.num ? "n" : ""}">${c.label}</th>`).join("")}</tr></thead><tbody>${
    b.rows.map((r, i) => `<tr class="${b.highlight === i ? "best" : ""}">${r.map((v, j) => `<td class="${b.columns[j].num ? "n" : ""}${String(v).startsWith("hidden by CMS") ? " sup" : ""}${b.columns[j].ok ? " ok" : ""}">${v}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
let chartQueue = [];
function block(b) {
  switch (b.type) {
    case "p": return `<p class="${b.cls ?? ""}">${b.html}</p>`;
    case "h3": return `<h3>${b.html}</h3>`;
    case "callout": return `<div class="callout ${b.plain ? "plain" : ""}">${b.title ? `<span class="t">${b.title}</span>` : ""}<p>${b.html}</p></div>`;
    case "say": return `<div class="say"><b>Say:</b> ${b.html}</div>`;
    case "list": return `<div class="how">${b.title ? `<h3>${b.title}</h3>` : ""}<ul>${b.items.map(i => `<li>${i}</li>`).join("")}</ul></div>`;
    case "text": return `<div class="how"><h3>${b.title}</h3><p>${b.html}</p></div>`;
    case "tiles": return `<div class="tiles">${b.items.map(t => `<div class="tile"><span class="v">${t.value}</span><span class="l">${t.label}</span>${t.src ? `<span class="stat-src">${t.src}</span>` : ""}</div>`).join("")}</div>`;
    case "cols": return `<div class="grid2">${b.blocks.map(block).join("")}</div>`;
    case "table": return tableHTML(b);
    case "chart": { const id = "c" + chartQueue.length; chartQueue.push([id, b]);
      return `<div class="chart"><h3>${b.title}</h3>${b.sub ? `<span class="sub">${b.sub}</span>` : ""}${legend(b.legend)}<svg id="${id}"></svg></div>`; }
    case "issues": return `<div class="issue">${b.items.map(q => `<div class="issue-q"><span class="k">${q.k}</span><b>${q.q}</b><span class="m">${q.how}</span><span class="m">${q.where}${q.verdict ? ` <span class="verdict ${q.ok === false ? "no" : ""}">${q.verdict}</span>` : ""}</span></div>`).join("")}</div>`;
    case "refs": return `<div class="refs"><span>Sources</span><ol>${b.items.map(r => `<li>${r}</li>`).join("")}</ol></div>`;
    case "reco": return `<div class="reco">${b.items.map((r, i) => `<div class="reco-item"><span class="k">${i + 1}</span><div><h3>${r.k}</h3><p>${r.html}</p></div></div>`).join("")}</div>`;
    case "limits": return `<div class="limits">${b.cols.map(c => `<div><h3>${c.title}</h3><ul>${c.items.map(i => `<li>${i}</li>`).join("")}</ul></div>`).join("")}</div>`;
    default: return `<p>Unknown block type: ${b.type}</p>`;
  }
}
/* ---------- page ---------- */
const P = PAGE;
$("#page").innerHTML = `
  <header class="hero">
    <span class="eyebrow">${P.eyebrow}</span><h1>${P.title}</h1><p class="lede">${P.lede}</p>
    <p class="opener">${P.opener}<small>${P.opener_note}</small></p>
    <nav class="agenda" aria-label="Sections">${P.sections.map(s => `<a href="#${s.id}">${s.nav}</a>`).join("")}</nav>
  </header>
  ${P.sections.map(s => `<section class="slide" id="${s.id}"><div class="slide-head"><h2>${s.title}</h2><span class="time">${s.time}</span></div>${s.blocks.map(block).join("")}</section>`).join("")}
  <footer>${P.footer.map(f => `<span>${f}</span>`).join("")}</footer>`;
chartQueue.forEach(([id, b]) => CHARTS[b.kind]($("#" + id), b.data, b.opts));
</script>
