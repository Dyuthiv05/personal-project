87 diabetic inpatients had 2+ other stays in the past year. They're readmitted within 30 days at 21.5% (vs. 8.5%), and 71% came back at some point after discharge.","**What it's worth.** A hospital stay costs Medicare about $17,094 (2026 dollars). Per 1,000 diabetic discharges, covering this group avoids about 10 admissions a year, a net saving of about $95,000. Covering pays for itself up to about $313 a month for patients with 2 prior stays and $619 with 3+.","**What to do.** Bring this to Medicare Advantage plans and ACOs, which pay for both the drug and the hospital stay: propose no prior authorization or step therapy for this group, a net price per tier, and a rebate if admissions don't fall."],"items":["<b>Who.</b> 2,397 of 69,987 diabetic inpatients had 2+ other stays in the past year. They're readmitted within 30 days at 21.5% (vs. 8.5%), and 71% came back at some point after discharge.","<b>What it's worth.</b> A hospital stay costs Medicare about $17,094 (2026 dollars). Per 1,000 diabetic discharges, covering this group avoids about 10 admissions a year, a net saving of about $95,000. Covering pays for itself up to about $313 a month for patients with 2 prior stays and $619 with 3+.","<b>What to do.</b> Bring this to Medicare Advantage plans and ACOs, which pay for both the drug and the hospital stay: propose no prior authorization or step therapy for this group, a net price per tier, and a rebate if admissions don't fall."]},{"type":"say","md":"I'll start with the answer, then show how I got there: who decides access, who these patients are, what the drugs cost, and where the math works.","html":"I'll start with the answer, then show how I got there: who decides access, who these patients are, what the drugs cost, and where the math works."}]},{"id":"situation","nav":"1 · Situation","title":"1 · Effective, expensive drugs, and the payer decides who gets them","time":"1:30 – 2:45","blocks":[{"type":"tiles","items":[{"value":"38.4M","label":"Americans have onal ladder treats GLP-1 and SGLT2 drugs as the “big guns” added after metformin and other pills. For patients with <b>heart disease, heart failure or kidney disease</b>, guidelines now recommend them <b>early, regardless of blood sugar and whether the patient is already on metformin</b> [4]. For those patients, they're no longer a last resort."},{"type":"text","title":"The catch","md":"They're 76% of Medicare diabetes drug spending but only 33% of prescriptions filled, and uptake among eligible patients is still low [5]. Plans often still apply the old ladder through **step therapy**: try metformin and cheaper drugs first. Medicare's negotiated prices (Jardiance $197 a month from 2026, semaglutide $274 from 2027) change that math [6].","html":"They're 76% of Medicare diabetes drug spending but only 33% of prescriptions filled, and uptake among eligible patients is still low [5]. Plans often still apply the old ladder through <b>step therapy</b>: try metformin and cheaper drugs first. Medicare's negotiated prices (Jardiance $197 a month from 2026, semaglutide $274 from 2027) change that math [6]."}]},{"type":"h3","md":"Who actually decides whether a patient gets the drug","html":"Who actually decides whether a patient gets the drug"},{"type":"table","columns":[{"label":"Who","num":false},{"label":"What they control","num":false}],"rows":[["<b>Doctor</b>","Chooses the drug and writes the prescription."],["<b>Payer</b> (insurance plan)","Decides whether the drug is covered (formulary), whether the doctor must file a <b>prior authorization</b>, whether the patient must fail cheaper drugs first (<b>step therapy</b>), and the patient's copay."],["<b>Patient</b>","Fills the prescription only if it's covered and affordable."]]},{"type":"callout","title":"Why the payer is the audience","md":"In the US, **who can actually get a GLP-1 or SGLT2 drug is decided by the payer, not the doctor.** A doctor can prescribe it, but if the plan requires paperwork, cheaper drugs first, or a high copay, many patients never start it. Payers loosen those rules only where they believe the drug pays for itself.","html":"In the US, <b>who can actually get a GLP-1 or SGLT2 drug is decided by the payer, not the doctor.</b> A doctor can prescribe it, but if the plan requires paperwork, cheaper drugs first, or a high copay, many patients never start it. Payers loosen those rules only where they believe the drug pays for itself."},{"type":"say","md":"A manufacturer can't make a doctor prescribe. What it can do is show payers where removing the access hurdles pays for itself.","html":"A manufacturer can't make a doctor prescribe. What it can do is show payers where removing the access hurdles pays for itself."},{"type":"refs","items":["<a href=\"https://www.cdc.gov/diabetes/php/data-research/index.html\">CDC, National Diabetes Statistics Report: At a glance</a>","<a href=\"https://diabetes.org/about-us/statistics/cost-diabetes\">American Diabetes Association, Economic Costs of Diabetes in the U.S. in 2022</a> (Parker et al., <i>Diabetes Care</i>)","<a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC8418292\">Rubin &amp; Shah, \"Predicting and Preventing Acute Care Re-Utilization by Patients with Diabetes,\" <i>Current Diabetes Reports</i>, 2021</a>","American Diabetes Association, Standards of Care in Diabetes—2025, Section 9: Pharmacologic Approaches (<i>Diabetes Care</i> 48, Supplement 1)","<a href=\"https://doaj.org/article/241fc9acf8aa4641a972e8d294236447\">GLP-1 RA / SGLT2i use after new ASCVD diagnosis, 2018–2022, <i>BMJ Open Diabetes Research &amp; Care</i>, 2024</a>","<a href=\"https://cms.gov/files/document/fact-sheet-negotiated-prices-initial-price-applicability-year-2026.pdf\">CMS, Medicare negotiated prices for 2026</a> and <a href=\"https://www.healthcaredive.com/news/medicare-price-negotiation-wegovy-ozempic-trelegy-2027/806578/\">2027 (semaglutide)</a>"]}]},{"id":"brief","nav":"2 · Client","title":"2 · The client and the brief","time":"2:45 – 3:45","blocks":[{"type":"callout","title":"The client","md":"**A manufacturer of an SGLT2 diabetes drug (hypothetical), specifically its US market access and health economics team**: the people who negotiate with insurance plans over coverage, price and rebates.","html":"<b>A manufacturer of an SGLT2 diabetes drug (hypothetical), specifically its US market access and health economics team</b>: the people who negotiate with insurance plans over coverage, price and rebates."},{"type":"table","columns":[{"label":"For the client","num":false},{"label":"","num":false}],"rows":[["<b>What's changing</b>","Medicare's negotiated price takes effect in 2026: Jardiance drops to $197 a month (from a 2023 list price of $573). Revenue per prescription falls by about two-thirds, so growth has to come from <b>more appropriate patients actually getting the drug</b>."],["<b>Their barrier</b>","Doctors already have the evidence and the guidelines. What stops many patients is the plan's access rules: prior authorization, step therapy and copays."],["<b>The competition</b>","GLP-1 drugs are the other major newer class and reach their own negotiated price in 2027, so plans are re-examining what they cover and on what terms."],["<b>The decision</b>","Which patient group to lead plan negotiations with, what coverage terms to ask for, and what net price or rebate to offer in return."]]},{"type":"callout","title":"Problem statement","md":"**For which diabetic patients does covering an SGLT2 drug (and, by comparison, a GLP-1) pay for itself for the payer through the hospital stays it prevents, at what net price, and what coverage rule should the manufacturer propose to Medicare Advantage plans and ACOs?**","html":"<b>For which diabetic patients does covering an SGLT2 drug (and, by comparison, a GLP-1) pay for itself for the payer through the hospital stays it prevents, at what net price, and what coverage rule should the manufacturer propose to Medicare Advantage plans and ACOs?</b>"},{"type":"table","columns":[{"label":"Scope","num":false},{"label":"","num":false}],"rows":[["<b>In</b>","Medicare-age diabetic patients; SGLT2 at 2024 gross vs. 2026 negotiated price; GLP-1 as a comparison; savings from avoided hospital stays."],["<b>Out</b>","Commercial plans; benefits other than hospital stays (deaths, kidney failure, quality of life); targeting individual doctors."],["<b>A good answer</b>","A coverage rule a plan can run in its own claims data, the net price at which it pays for itself, and a pilot to prove it."]]},{"type":"say","md":"Here's the client and the decision they face. Everything that follows is built to answer one question: which patients, at what price, and with what coverage rule.","html":"Here's the client and the decision they face. Everything that follows is built to answer one question: which patients, at what price, and with what coverage rule."}]},{"id":"approach","nav":"3 · Approach","title":"3 · How the analysis fits together: A and B are the two sides of one equation, C solves it","time":"3:45 – 4:30","blocks":[{"type":"p","md":"A payer's question is simple arithmetic: **does the money this drug saves in hospital stays exceed what the drug costs?** Part A measures the savings side for each patient, Part B the cost side, and Part C puts them together.","html":"A payer's question is simple arithmetic: <b>does the money this drug saves in hospital stays exceed what the drug costs?</b> Part A measures the savings side for each patient, Part B the cost side, and Part C puts them together."},{"type":"table","columns":[{"label":"Part","num":false},{"label":"Question","num":false},{"label":"What it produces","num":false},{"label":"How Part C uses it","num":false}],"rows":[["<b>A</b>","Which diabetic patients keep coming back to hospital?","Each patient's <b>prior hospital stays</b> in the past year. Checked against what happened next: 38% of patients with none were readmitted later, vs. 71% with 2+.","<b>The savings side:</b> how many hospital stays the drug could prevent for each patient."],["<b>B</b>","What does the drug cost the payer?","The <b>annual cost</b> of treatment: $2,364 a year at the 2026 negotiated price, $6,491 at 2024 gross.","<b>The cost side:</b> how much the drug has to save to break even."],["<b>C</b>","Where does covering it pay for itself, and what rule follows?","The break-even point, the patients above it, and the price per tier.","Combines A and B into a coverage rule a payer can write."]]},{"type":"callout","title":"The equation behind the rule","md":"Covering pays for itself when **prior stays (A) × 11% fewer stays (trial) × $17,094 per stay > annual drug cost (B)**. At $2,364 a year, that takes **1.26 stays a year**. Hospital stays come in whole numbers, so one prior stay falls short and **two or more clear it**. That's the rule: *2+ hospital stays in the past year*. **Where the 11% comes from:** EMPA-REG OUTCOME, the main trial of Jardiance (7,020 adults with type 2 diabetes and heart disease, about three years): 36.8% on the drug were hospitalized for any reason vs. 39.6% on placebo, a hazard ratio of 0.89, or 11% lower risk. It measured the *first* hospitalization in outpatients, so I stress-test it down to 4%, the bottom of its confidence interval.","html":"Covering pays for itself when <b>prior stays (A) × 11% fewer stays (trial) × $17,094 per stay &gt; annual drug cost (B)</b>. At $2,364 a year, that takes <b>1.26 stays a year</b>. Hospital stays come in whole numbers, so one prior stay falls short and <b>two or more clear it</b>. That's the rule: <i>2+ hospital stays in the past year</i>. <b>Where the 11% comes from:</b> EMPA-REG OUTCOME, the main trial of Jardiance (7,020 adults with type 2 diabetes and heart disease, about three years): 36.8% on the drug were hospitalized for any reason vs. 39.6% on placebo, a hazard ratio of 0.89, or 11% lower risk. It measured the <i>first</i> hospitalization in outpatients, so I stress-test it down to 4%, the bottom of its confidence interval."},{"type":"p","md":"**What would move the rule:** if B's price fell to about $157 a month, patients with one prior stay would qualify too; at 2024 gross prices, only patients with four or more would. **What A adds beyond the count:** prior stays predict who returns, and a readmission model adds little on top, so the rule can be a simple count any plan can run in its claims data.","html":"<b>What would move the rule:</b> if B's price fell to about $157 a month, patients with one prior stay would qualify too; at 2024 gross prices, only patients with four or more would. <b>What A adds beyond the count:</b> prior stays predict who returns, and a readmission model adds little on top, so the rule can be a simple count any plan can run in its claims data."},{"type":"say","md":"Think of it as two halves of one equation. Part A tells us how many hospital stays each patient could avoid; Part B tells us what the drug costs; Part C finds where the first outweighs the second. The 11% is from EMPA-REG, Jardiance's main outcomes trial: an 11% lower risk of being hospitalized for any reason. The rule falls straight out of that.","html":"Think of it as two halves of one equation. Part A tells us how many hospital stays each patient could avoid; Part B tells us what the drug costs; Part C finds where the first outweighs the second. The 11% is from EMPA-REG, Jardiance's main outcomes trial: an 11% lower risk of being hospitalized for any reason. The rule falls straight out of that."}]},{"id":"data","nav":"4 · Data","title":"4 · One downloaded dataset, 4 API pulls, no patient identifiers","time":"4:30 – 5:00","blocks":[{"type":"table","columns":[{"label":"Source","num":false},{"label":"How I got it","num":false},{"label":"Rows","num":true},{"label":"What it answers","num":false}],"rows":[["Kaggle · Diabetes 130-US Hospitals (1999–2008)","<span class=\"chip\">Downloaded</span>","101,766","Patients, prior stays, drugs and readmissions, 1999–2008"],["CMS Part D Prescribers by Geography & Drug, national, 2013–2024","<span class=\"chip\">My API pull</span>","1,404","National prescriptions, fills and cost per drug, every year 2013–2024"],["CMS Medicare Inpatient Hospitals by Geography & Service (2024)","<span class=\"chip\">My API pull</span>","767","What a hospital stay costs Medicare, by type of stay (2024)"],["BLS CPI, inpatient hospital services (2017–2026)","<span class=\"chip\">My API pull</span>","115","Hospital price index, to put every dollar in 2026"],["NLM RxClass (ATC classes)","<span class=\"chip\">My API pull</span>","48","Drug → class mapping (ATC), shared by all notebooks"]]},{"type":"p","md":"Outside inputs with sources (trial effect, negotiated prices, benchmarks) are in `reference/assumptions.csv`. **No patient-identifying information anywhere:** the hospital data is a de-identified research extract, and every API source is a national total. Sample rows and the privacy checks are in notebook 01.","html":"Outside inputs with sources (trial effect, negotiated prices, benchmarks) are in <span class=\"mono\">reference/assumptions.csv</span>. <b>No patient-identifying information anywhere:</b> the hospital data is a de-identified research extract, and every API source is a national total. Sample rows and the privacy checks are in notebook 01."}]},{"id":"partA","nav":"5 · A: Who","title":"5 · A: Prior hospital stays are the clearest signal: 26.5% readmitted with 3+ vs. 8.1% with none","time":"5:00 – 6:30","blocks":[{"type":"tiles","items":[{"value":"9.0%","label":"of 69,987 diabetic patients were back within 30 days","src":null},{"value":"3.4%","label":"had 2 or more other hospital stays in the past year","src":null},{"value":"18%","label":"had their blood sugar (A1C) checked during the stay","src":null},{"value":"40%","label":"of patients with a high A1C had no change to their diabetes medications during the stay","src":null}]},{"type":"cols","blocks":[{"type":"chart","kind":"hbars","title":"Prior hospital stays drive readmission","sub":"% readmitted within 30 days · dashed line = all patients","legend":null,"data":[{"label":"None","value":8.1,"tip":"<b>0 prior stays</b><br>8.1% readmitted<br>61,792 patients (88.3%)"},{"label":"1 prior stay","value":12.9,"tip":"<b>1 prior stays</b><br>12.9% readmitted<br>5,798 patients (8.3%)"},{"label":"2 prior stays","value":18.5,"tip":"<b>2 prior stays</b><br>18.5% readmitted<br>1,501 patients (2.1%)"},{"label":"3+ prior stays","value":26.5,"tip":"<b>3+ prior stays</b><br>26.5% readmitted<br>896 patients (1.3%)"}],"opts":{"labelW":120,"max":30,"ticks":[0,10,20,30],"tickFmt":{"suffix":"%"},"valFmt":{"d":1,"suffix":"%"},"ref":9.0}},{"type":"chart","kind":"hbars","title":"So does where patients go next","sub":"% readmitted within 30 days, by discharge destination","legend":null,"data":[{"label":"Nursing / care facility","value":15.1,"tip":"<b>Skilled nursing / care facility</b><br>15.1% readmitted<br>11,940 patients"},{"label":"Other hospital","value":13.8,"tip":"<b>Transferred to another hospital</b><br>13.8% readmitted<br>1,541 patients"},{"label":"Home with home health","value":9.5,"tip":"<b>Home with home health</b><br>9.5% readmitted<br>8,364 patients"},{"label":"Left against advice","value":9.5,"tip":"<b>Left against medical advice</b><br>9.5% readmitted<br>409 patients"},{"label":"Home","value":6.9,"tip":"<b>Home</b><br>6.9% readmitted<br>44,320 patients"}],"opts":{"labelW":170,"max":20,"ticks":[0,10,20],"tickFmt":{"suffix":"%"},"valFmt":{"d":1,"suffix":"%"},"ref":9.0}}]},{"type":"table","columns":[{"label":"Readmission model","num":false},{"label":"Ranking accuracy (AUC; 0.5 = coin flip)","num":true},{"label":"Top 10% flagged: readmitted vs. average","num":true}],"rows":[["Penalized logistic (L1)","0.64","2.0×"],["Random forest <span class=\"chip\">best</span>","0.66","2.3×"],["Neural network (MLP)","0.64","2.0×"]],"highlight":1},{"type":"say","md":"History and destination predict a return far better than diagnosis: 3+ prior stays means 26.5% "color":"s4"},{"label":"Medicare negotiated price × 12","color":"s1"}],"data":[{"label":"Ozempic (GLP-1)","values":[10840.0,3288.0],"tip":"<b>Ozempic</b><br>2024 gross: $903 per 30 days, $10,840 a year<br>Negotiated: $274 per 30 days"},{"label":"Jardiance (SGLT2)","values":[6491.0,2364.0],"tip":"<b>Jardiance</b><br>2024 gross: $541 per 30 days, $6,491 a year<br>Negotiated: $197 per 30 days"},{"label":"Mounjaro (GLP-1)","values":[12475.0,0],"tip":"<b>Mounjaro</b><br>2024 gross: $1,040 per 30 days, $12,475 a year<br>No negotiated price yet"},{"label":"Trulicity (GLP-1)","values":[11381.0,0],"tip":"<b>Trulicity</b><br>2024 gross: $948 per 30 days, $11,381 a year<br>No negotiated price yet"},{"label":"Farxiga (SGLT2)","values":[6460.0,2142.0],"tip":"<b>Farxiga</b><br>2024 gross: $538 per 30 days, $6,460 a year<br>Negotiated: $178 per 30 days"},{"label":"Rybelsus (GLP-1)","values":[10989.0,3288.0],"tip":"<b>Rybelsus</b><br>2024 gross: $916 per 30 days, $10,989 a year<br>Negotiated: $274 per 30 days"}],"opts":{"max":14000,"ticks":[0,5000,10000],"tickFmt":{"prefix":"$","div":1000,"suffix":"K"},"valFmt":{"prefix":"$","div":1000,"d":1,"suffix":"K"},"colors":["s4","s1"],"names":["2024 gross","Negotiated"]}},{"type":"say","md":"None of these drugs were used in the 1999–2008 hospital data. From one consistent Medicare source they went from 1.5% of prescriptions in 2013 to 33% in 2024, while taking 76% of spending. A year of Jardiance costs Medicare about $6,491 at 2024 gross cost and $2,364 at the 2026 negotiated price, same drug, so it's a fair comparison. That price is the input to the next slide.","html":"None of these drugs were used in the 1999–2008 hospital data. From one consistent Medicare source they went from 1.5% of prescriptions in 2013 to 33% in 2024, while taking 76% of spending. A year of Jardiance costs Medicare about $6,491 at 2024 gross cost and $2,364 at the 2026 negotiated price, same drug, so it's a fair comparison. That price is the input to the next slide."}]},{"id":"partC","nav":"7 · C: Value","title":"7 · C: At the negotiated price, it pays for itself from two prior stays","time":"8:00 – 10:00","blocks":[{"type":"p","md":"**The model, per patient-year:** admissions avoided = prior hospital stays in the past year × 11% (EMPA-REG trial); savings = avoided × $17,094, Medicare's share of an average stay in 2026 dollars; net value = savings − the drug's annual cost. The stay the patient is leaving is **not** counted: a drug started at discharge can't prevent it. Only hospital savings count, so this is conservative.","html":"<b>The model, per patient-year:</b> admissions avoided = prior hospital stays in the past year × 11% (EMPA-REG trial); savings = avoided × $17,094, Medicare's share of an average stay in 2026 dollars; net value = savings − the drug's annual cost. The stay the patient is leaving is <b>not</b> counted: a drug started at discharge can't prevent it. Only hospital savings count, so this is conservative."},{"type":"table","columns":[{"label":"Price","num":false},{"label":"Annual drug cost","num":true},{"label":"Break-even: prior stays a year","num":true}],"rows":[["SGLT2 · negotiated (2026)","$2,364","1.26"],["SGLT2 · gross 2024","$6,491","3.45"]]},{"type":"chart","kind":"hgroup","title":"Net value per patient-year, by prior hospital stays in the past year","sub":"Positive = covering the drug pays for itself through avoided hospital stays","legend":[{"label":"SGLT2 (Jardiance) · 2026 negotiated","color":"s1"},{"label":"SGLT2 (Jardiance) · 2024 gross","color":"s4"}],"data":[{"label":"No prior stay","values":[-2364.0,-6491.0],"tip":"<b>No prior stay</b> (88.3% of patients)<br>0.0 prior stays<br>SGLT2 · negotiated (2026): −$2,364<br>SGLT2 · gross 2024: −$6,491"},{"label":"1 prior stay","values":[-483.6,-4610.6],"tip":"<b>1 prior stay</b> (8.3% of patients)<br>1.0 prior stays<br>SGLT2 · negotiated (2026): −$484<br>SGLT2 · gross 2024: −$4,611"},{"label":"2 prior stays","values":[1396.7,-2730.3],"tip":"<b>2 prior stays</b> (2.1% of patients)<br>2.0 prior stays<br>SGLT2 · negotiated (2026): $1,397<br>SGLT2 · gross 2024: −$2,730"},{"label":"3+ prior stays","values":[5058.8,931.8],"tip":"<b>3+ prior stays</b> (1.3% of patients)<br>3.9 prior stays<br>SGLT2 · negotiated (2026): $5,059<br>SGLT2 · gross 2024: $932"}],"opts":{"labelW":120,"dom":[-7500,7500],"ticks":[-5000,0,5000],"tickFmt":{"prefix":"$","div":1000,"suffix":"K"},"valFmt":{"prefix":"$","div":1000,"d":1,"suffix":"K"},"colors":["s1","s4"],"names":["SGLT2 · negotiated (2026)","SGLT2 · gross 2024"]}},{"type":"h3","md":"Does the past predict the future? What actually happened after discharge","html":"Does the past predict the future? What actually happened after discharge"},{"type":"table","columns":[{"label":"Prior stays","num":false},{"label":"Share of patients","num":true},{"label":"Readmitted within 30 days","num":true},{"label":"Readmitted at any point later","num":true}],"rows":[["No prior stay","88.3%","8.1%","38.1%"],["1 prior stay","8.3%","12.9%","55.8%"],["2 prior stays","2.1%","18.5%","67.4%"],["3+ prior stays","1.3%","26.5%","77.3%"]]},{"type":"say","md":"Break-even at the negotiated price is 1.26 prior stays a year. With none, the drug can't pay for itself through hospital savings; with one, it's slightly short (−$484 a year); with two or more, it's about $2,766. And the past does predict the future: patients with 2+ prior stays were readmitted far more often after discharge. At 2024 gross prices, only patients with 3+ prior stays clear it.","html":"Break-even at the negotiated price is 1.26 prior stays a year. With none, the drug can't pay for itself through hospital savings; with one, it's slightly short (−$484 a year); with two or more, it's about $2,766. And the past does predict the future: patients with 2+ prior stays were readmitted far more often after discharge. At 2024 gross prices, only patients with 3+ prior stays clear it."}]},{"id":"rule","nav":"8 · C: Rule","title":"8 · C: A coverage rule, the price that makes it work, and how sure we are","time":"10:00 – 12:00","blocks":[{"type":"table","columns":[{"label":"Prior stays","num":false},{"label":"Share of patients","num":true},{"label":"Readmitted later","num":true},{"label":"Covering pays for itself up to (per month)","num":true},{"label":"At the $197/month negotiated price","num":false}],"rows":[["No prior stay","88.3%","38.1%","—","costs more than it saves"],["1 prior stay","8.3%","55.8%","<b>$157</b>","costs more than it saves"],["2 prior stays","2.1%","67.4%","<b>$313</b>","pays for itself"],["3+ prior stays","1.3%","77.3%","<b>$619</b>","pays for itself"]]},{"type":"callout","title":"The coverage rule a plan could write","md":"*Type 2 diabetes with heart or kidney disease, 2 or more hospital stays in the past 12 months, and not already on a GLP-1 or SGLT2 drug → cover with no prior authorization or step therapy.* Pays for itself at a net price up to about $313 a month with 2 prior stays and $619 with 3+. Heart or kidney disease is there because it's the guideline indication and the trial's population; it doesn't change how often patients return.","html":"<i>Type 2 diabetes with heart or kidney disease, 2 or more hospital stays in the past 12 months, and not already on a GLP-1 or SGLT2 drug → cover with no prior authorization or step therapy.</i> Pays for itself at a net price up to about $313 a month with 2 prior stays and $619 with 3+. Heart or kidney disease is there because it's the guideline indication and the trial's population; it doesn't change how often patients return."},{"type":"chart","kind":"tornado","title":"How sure are we? Net value per patient-year for the 2+ group, one assumption at a time","sub":"Orange = can turn negative","legend":null,"data":[{"label":"Hospitalization reduction (4% – 18%)","low":-499.0,"high":6030.0,"tip":"<b>Hospitalization reduction (4% – 18%)</b><br>low: −$499<br>high: $6,030"},{"label":"Price (negotiated – 2024 gross)","low":-1361.0,"high":2766.0,"tip":"<b>Price (negotiated – 2024 gross)</b><br>low: −$1,361<br>high: $2,766"},{"label":"Cost of a stay ($9,664 – $20,654)","low":536.0,"high":3834.0,"tip":"<b>Cost of a stay ($9,664 – $20,654)</b><br>low: $536<br>high: $3,834"},{"label":"Future stays (50% – 100% of past)","low":201.0,"high":2766.0,"tip":"<b>Future stays (50% – 100% of past)</b><br>low: $201<br>high: $2,766"}],"opts":{"labelW":260,"dom":[-2000,7000],"ticks":[0,2000,4000,6000],"tickFmt":{"prefix":"$","div":1000,"d":1,"suffix":"K"},"base":2766.0}},{"type":"say","md":"Price is the strongest lever: each tier has a net price below which covering pays for itself. The case holds if these patients return half as often ($201), for Medicare-insured patients ($2,715) and for patients with heart disease ($2,694). It fails at the trial's lowest effect (−$499) and at gross price (−$1,361). For GLP-1 drugs I didn't assume the SGLT2 effect: at their negotiated price they'd need about a 7% reduction in hospital stays to pay off for this group.","html":"Price is the strongest lever: each tier has a net price below which covering pays for itself. The case holds if these patients return half as often ($201), for Medicare-insured patients ($2,715) and for patients with heart disease ($2,694). It fails at the trial's lowest effect (−$499) and at gross price (−$1,361). For GLP-1 drugs I didn't assume the SGLT2 effect: at their negotiated price they'd need about a 7% reduction in hospital stays to pay off for this group."}]},{"id":"reco","nav":"9 · Recommendation","title":"9 · Recommendation: win access through the payer","time":"12:00 – 13:45","blocks":[{"type":"table","columns":[{"label":"#","num":false},{"label":"Action","num":false},{"label":"Who acts","num":false}],"rows":[["1","<b>Take the cost-offset case to Medicare Advantage plans and ACOs</b>: the organizations that pay for both the drug and the hospital stay, so they capture the saving. (In traditional Medicare the drug is paid by Part D and the stay by Part A, so no single party sees both.)","Market access"],["2","<b>Propose the coverage rule</b>: type 2 diabetes with heart or kidney disease, 2+ hospital stays in the past 12 months, not already on a GLP-1 or SGLT2 → no prior authorization, no step therapy, lower copay tier.","Market access with the plan"],["3","<b>Price by tier, backed by outcomes</b>: a net price at or below about $313 a month for the 2-stay tier, with a rebate if the group's admissions don't fall.","Market access"],["4","<b>Give the plan the claims rule</b> so its care managers can flag eligible members and contact their doctors. It runs in any claims system, no model needed.","The plan"],["5","<b>Focus medical education on the discharge moment</b>: hospitalists and cardiologists see these patients in hospital, where only 18% had an A1C test. Trial evidence on reducing hospitalizations, on-label.","Medical affairs"],["6","<b>Pilot with one plan for 12 months</b>: compare admissions for covered members against matched members, then use the result with the next plan.","Market access with the plan"]]},{"type":"say","md":"The doctor still decides, but the payer decides whether the doctor's decision reaches the patient. These six steps move the access decision, with a price and a rule the payer can check.","html":"The doctor still decides, but the payer decides whether the doctor's decision reaches the patient. These six steps move the access decision, with a price and a rule the payer can check."}]},{"id":"risks","nav":"10 · Risks","title":"10 · Risks, limitations and next steps","time":"13:45 – 15:00","blocks":[{"type":"h3","md":"How the years are reconciled","html":"How the years are reconciled"},{"type":"table","columns":[{"label":"Input","num":false},{"label":"Data year","num":false},{"label":"How it's aligned","num":false},{"label":"Effect on the result","num":false}],"rows":[["Prior hospital stays per patient","1999–2008","Checked against what happened after discharge (section 3) and recent readmission rates; 50% scenario","Likely understates value: 30-day readmission here (11.4% of stays) is below recent studies (16–20%)"],["Drug effect (11%)","2015 trial","Range 4–18%; heart-disease subgroup tested","Could overstate: the trial measured first hospitalization in outpatients with heart disease"],["Cost of a stay","2024 (CMS); 2018 (HCUP check)","Medicare's share, moved to 2026 with the BLS hospital price index","CPI may run above Medicare's own rate updates; low case uses no inflation"],["Drug prices","2024 gross; 2026/27 negotiated","Negotiated prices are already the decision years","Gross is before confidential rebates, so it overstates the net price"]]},{"type":"limits","cols":[{"title":"Limitations","md":["Hospital patterns come from 1999–2008; costs are in 2026 dollars, but who gets readmitted today may differ.","The 11% effect comes from EMPA-REG (outpatients with heart disease; time to first hospitalization), applied to admission counts; tested at 4%.","Next year's stays are assumed to match last year's; tested at half.","Only hospital savings count, not deaths, kidney failure or quality of life, so value is understated.","Gross cost is before confidential rebates; the true net price sits between gross and negotiated.","For GLP-1 drugs the deck shows the effect they would need rather than assuming one."],"items":["Hospital patterns come from 1999–2008; costs are in 2026 dollars, but who gets readmitted today may differ.","The 11% effect comes from EMPA-REG (outpatients with heart disease; time to first hospitalization), applied to admission counts; tested at 4%.","Next year's stays are assumed to match last year's; tested at half.","Only hospital savings count, not deaths, kidney failure or quality of life, so value is understated.","Gross cost is before confidential rebates; the true net price sits between gross and negotiated.","For GLP-1 drugs the deck shows the effect they would need rather than assuming one."]},{"title":"Next steps","md":["Re-estimate prior and const F = (v, s = {}) => s.plain ? String(v) : (v < 0 ? "−" : "") + (s.prefix ?? "") + fmt(Math.abs(v) / (s.div ?? 1), s.d ?? 0) + (s.suffix ?? "");   // plain: years, no separators
const col = c => c && c.startsWith("s") && c.length === 2 ? `var(--${c})` : c;

const tip = $("#tip");
function showTip(e, html) { tip.innerHTML = html; tip.style.opacity = 1; tip.style.left = Math.min(e.clientX + 14, innerWidth - 270) + "px"; tip.style.top = (e.clientY + 14) + "px"; }
function hideTip() { tip.style.opacity = 0; }
function el(tag, attrs = {}, parent) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
function txt(parent, x, y, s, cls, extra = {}) { const t = el("text", { x, y, class: cls, ...extra }, parent); t.textContent = s; return t; }
function hover(node, html) { if (!html) return; node.addEventListener("pointermove", e => showTip(e, html)); node.addEventListener("pointerleave", hideTip); }

/* ---------- charts ---------- */
function hbars(svg, rows, o) {
  const W = 620, lw = o.labelW ?? 190, rh = o.rowH ?? 30, top = 6, H = top + rows.length * rh + 22;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const max = o.max, x = v => lw + (W - lw - 60) * v / max;
  o.ticks.forEach(t => { el("line", { x1: x(t), x2: x(t), y1: top, y2: H - 20, class: "gridl" }, svg); txt(svg, x(t), H - 6, F(t, o.tickFmt), "ax", { "text-anchor": "middle" }); });
  rows.forEach((r, i) => {
    const y = top + i * rh, bh = Math.min(16, rh - 10), w = Math.max(3, x(r.value) - lw);
    txt(svg, lw - 10, y + rh / 2 + 4, r.label, "lbl", { "text-anchor": "end" });
    el("path", { d: `M${lw},${y + (rh - bh) / 2} h${w - 3} a3,3 0 0 1 3,3 v${bh - 6} a3,3 0 0 1 -3,3 h${-(w - 3)} z`, fill: col(r.color ?? "s1") }, svg);
    txt(svg, lw + w + 6, y + rh / 2 + 4, F(r.value, o.valFmt), "val");
    hover(el("rect", { x: 0, y, width: W, height: rh, class: "hit" }, svg), r.tip);
  });
  if (o.ref != null) el("line", { x1: x(o.ref), x2: x(o.ref), y1: top - 2, y2: H - 20, class: "ref" }, svg);
  el("line", { x1: lw, x2: lw, y1: top, y2: H - 20, class: "base" }, svg);
}
function pairbars(svg, rows, o) {
  const W = 620, lw = 190, rh = 40, top = 4, H = top + rows.length * rh + 22;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const x = v => lw + (W - lw - 60) * v / o.max;
  o.ticks.forEach(t => { el("line", { x1: x(t), x2: x(t), y1: top, y2: H - 20, class: "gridl" }, svg); txt(svg, x(t), H - 6, F(t, o.tickFmt), "ax", { "text-anchor": "middle" }); });
  rows.forEach((r, i) => {
    const y = top + i * rh;
    txt(svg, lw - 10, y + rh / 2 + 4, r.label, "lbl", { "text-anchor": "end" });
    r.values.forEach((v, j) => {
      const yy = y + 6 + j * 14, w = Math.max(1.5, x(v) - lw);
      el("rect", { x: lw, y: yy, width: w, height: 12, rx: 2, fill: col(o.colors[j]) }, svg);
      if (v > 0) txt(svg, lw + w + 5, yy + 10, F(v, o.valFmt), "ax");
    });
    hover(el("rect", { x: 0, y, width: W, height: rh, class: "hit" }, svg), r.tip);
  });
  el("line", { x1: lw, x2: lw, y1: top, y2: H - 20, class: "base" }, svg);
}
function lines(svg, series, o) {
  const W = 620, H = o.H ?? 260, L = 44, R = 70, T = 12, B = 28;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const xs = series[0].pts.map(p => p[0]), xmin = Math.min(...xs), xmax = Math.max(...xs);
  const X = v => L + (W - L - R) * (v - xmin) / (xmax - xmin), Y = v => T + (H - T - B) * (1 - v / o.ymax);
  o.yticks.forEach(t => { el("line", { x1: L, x2: W - R, y1: Y(t), y2: Y(t), class: "gridl" }, svg); txt(svg, L - 8, Y(t) + 4, F(t, o.yFmt), "ax", { "text-anchor": "end" }); });
  (o.xticks ?? xs).forEach(t => txt(svg, X(t), H - 8, F(t, o.xFmt), "ax", { "text-anchor": "middle" }));
  el("line", { x1: L, x2: W - R, y1: Y(0), y2: Y(0), class: "base" }, svg);
  if (o.diag) el("line", { x1: X(xmin), y1: Y(0), x2: X(xmax), y2: Y(o.ymax), class: "ref" }, svg);
  series.forEach(s => {
    el("path", { d: s.pts.map((p, i) => (i ? "L" : "M") + X(p[0]) + "," + Y(p[1])).join(""), fill: "none", stroke: col(s.color), "stroke-width": 2.2, "stroke-linejoin": "round" }, svg);
    if (!o.noDots) s.pts.forEach(p => el("circle", { cx: X(p[0]), cy: Y(p[1]), r: 4, fill: col(s.color), stroke: "var(--panel)", "stroke-width": 2 }, svg));
    if (s.end) { const p = s.pts.at(-1); txt(svg, X(p[0]) + 8, Y(p[1]) + 4, s.end, "val"); }
  });
  (o.marks ?? []).forEach(m => { el("circle", { cx: X(m.x), cy: Y(m.y), r: 5, fill: col(m.color ?? "s2"), stroke: "var(--panel)", "stroke-width": 2 }, svg); txt(svg, X(m.x) + 10, Y(m.y) + 16, m.label, "val"); });
  const cross = el("line", { y1: T, y2: H - B, class: "ref", opacity: 0 }, svg);
  const hit = el("rect", { x: L, y: T, width: W - L - R, height: H - T - B, class: "hit" }, svg);
  hit.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect(), vx = xmin + (xmax - xmin) * (((e.clientX - r.left) * W / r.width) - L) / (W - L - R);
    const pts = series.map(s => s.pts.reduce((a, b) => Math.abs(b[0] - vx) < Math.abs(a[0] - vx) ? b : a));
    cross.setAttribute("x1", X(pts[0][0])); cross.setAttribute("x2", X(pts[0][0])); cross.setAttribute("opacity", 1);
    showTip(e, `<b>${F(pts[0][0], o.xFmt)}</b>` + series.map((s, i) => `<br>${s.name}: ${F(pts[i][1], o.tipFmt)}`).join(""));
  });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("opacity", 0); hideTip(); });
}
function hgroup(svg, rows, o) {
  const W = 620, lw = o.labelW ?? 150, n = o.names.length, bh = 11, rh = n * (bh + 3) + 14, top = 4, H = top + rows.length * rh + 24;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const [lo, hi] = o.dom, x = v => lw + (W - lw - 70) * (v - lo) / (hi - lo);
  o.ticks.forEach(t => { el("line", { x1: x(t), x2: x(t), y1: top, y2: H - 22, class: t === 0 ? "base" : "gridl" }, svg); txt(svg, x(t), H - 8, F(t, o.tickFmt), "ax", { "text-anchor": "middle" }); });
  rows.forEach((r, i) => {
    const y = top + i * rh;
    txt(svg, lw - 10, y + rh / 2 + 2, r.label, "lbl", { "text-anchor": "end" });
    r.values.forEach((v, j) => {
      const yy = y + 6 + j * (bh + 3), x0 = x(Math.min(0, v)), w = Math.max(1.5, Math.abs(x(v) - x(0)));
      el("rect", { x: x0, y: yy, width: w, height: bh, rx: 2, fill: col(o.colors[j]) }, svg);
      txt(svg, v >= 0 ? x(v) + 5 : x(v) - 5, yy + 9, F(v, o.valFmt), "ax", { "text-anchor": v >= 0 ? "start" : "end" });
    });
    hover(el("rect", { x: 0, y, width: W, height: rh, class: "hit" }, svg), r.tip);
  });
}
function tornado(svg, rows, o) {
  const W = 620, lw = o.labelW ?? 230, rh = 34, top = 18, H = top + rows.length * rh + 24;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const [lo, hi] = o.dom, x = v => lw + (W - lw - 20) * (v - lo) / (hi - lo);
  o.ticks.forEach(t => { el("line", { x1: x(t), x2: x(t), y1: top, y2: H - 22, class: t === 0 ? "base" : "gridl" }, svg); txt(svg, x(t), H - 8, F(t, o.tickFmt), "ax", { "text-anchor": "middle" }); });
  el("line", { x1: x(o.base), x2: x(o.base), y1: top - 10, y2: H - 22, class: "ref" }, svg);
  txt(svg, x(o.base), top - 12, "base case " + F(o.base, o.tickFmt), "ax", { "text-anchor": "middle" });
  rows.forEach((r, i) => {
    const y = top + i * rh, a = Math.min(r.low, r.high), b = Math.max(r.low, r.high);
    txt(svg, lw - 10, y + rh / 2 + 4, r.label, "lbl", { "text-anchor": "end" });
    el("rect", { x: x(a), y: y + 8, width: Math.max(2, x(b) - x(a)), height: rh - 16, rx: 3, fill: col(a < 0 ? "s2" : "s1"), "fill-opacity": 0.85 }, svg);
    txt(svg, x(a) - 5, y + rh / 2 + 4, F(r.low, o.tickFmt), "ax", { "text-anchor": "end" });
    txt(svg, x(b) + 5, y + rh / 2 + 4, F(r.high, o.tickFmt), "ax");
    hover(el("rect", { x: 0, y, width: W, height: rh, class: "hit" }, svg), r.tip);
  });
}
const CHARTS = { hbars, pairbars, lines, hgroup, tornado };

/* ---------- blocks ---------- */
const legend = items => items ? `<div class="legend">${items.map(i => `<span><i style="background:${col(i.color)}"></i>${i.label}</span>`).join("")}</div>` : "";
function tableHTML(b) {
  return `<div class="tbl-wrap"><table class="${b.dense ? "data" : ""}"><thead><tr>${b.columns.map(c => `<th class="${c.num ? "n" : ""}">${c.label}</th>`).join("")}</tr></thead><tbody>${
    b.rows.map((r, i) => `<tr class="${b.highlight === i ? "best" : ""}">${r.map((v, j) => `<td class="${b.columns[j].num ? "n" : ""}${String(v).startsWith("hidden by CMS") ? " sup" : ""}${b.columns[j].ok ? " ok" : ""}">${v}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
let chartQueue = [];
function block(b) {
  switch (b.type) {
    case "p": return `<p class="${b.cls ?? ""}">${b.html}</p>`;
    case "h3": return `<h3>${b.html}</h3>`;
    case "callout": return `<div class="callout ${b.plain ? "plain" : ""}">${b.title ? `<span class="t">${b.title}</span>` : ""}<p>${b.html}</p></div>`;
    case "say": return `<div class="say"><b>Say:</b> ${b.html}</div>`;
    case "list": return `<div class="how">${b.title ? `<h3>${b.title}</h3>` : ""}<ul>${b.items.map(i => `<li>${i}</li>`).join("")}</ul></div>`;
    case "text": return `<div class="how"><h3>${b.title}</h3><p>${b.html}</p></div>`;
    case "tiles": return `<div class="tiles">${b.items.map(t => `<div class="tile"><span class="v">${t.value}</span><span class="l">${t.label}</span>${t.src ? `<span class="stat-src">${t.src}</span>` : ""}</div>`).join("")}</div>`;
    case "cols": return `<div class="grid2">${b.blocks.map(block).join("")}</div>`;
    case "table": return tableHTML(b);
    case "chart": { const id = "c" + chartQueue.length; chartQueue.push([id, b]);
      return `<div class="chart"><h3>${b.title}</h3>${b.sub ? `<span class="sub">${b.sub}</span>` : ""}${legend(b.legend)}<svg id="${id}"></svg></div>`; }
    case "issues": return `<div class="issue">${b.items.map(q => `<div class="issue-q"><span class="k">${q.k}</span><b>${q.q}</b><span class="m">${q.how}</span><span class="m">${q.where}${q.verdict ? ` <span class="verdict ${q.ok === false ? "no" : ""}">${q.verdict}</span>` : ""}</span></div>`).join("")}</div>`;
    case "refs": return `<div class="refs"><span>Sources</span><ol>${b.items.map(r => `<li>${r}</li>`).join("")}</ol></div>`;
    case "reco": return `<div class="reco">${b.items.map((r, i) => `<div class="reco-item"><span class="k">${i + 1}</span><div><h3>${r.k}</h3><p>${r.html}</p></div></div>`).join("")}</div>`;
    case "limits": return `<div class="limits">${b.cols.map(c => `<div><h3>${c.title}</h3><ul>${c.items.map(i => `<li>${i}</li>`).join("")}</ul></div>`).join("")}</div>`;
    default: return `<p>Unknown block type: ${b.type}</p>`;
  }
}
/* ---------- page ---------- */
const P = PAGE;
$("#page").innerHTML = `
  <header class="hero">
    <span class="eyebrow">${P.eyebrow}</span><h1>${P.title}</h1><p class="lede">${P.lede}</p>
    <p class="opener">${P.opener}<small>${P.opener_note}</small></p>
    <nav class="agenda" aria-label="Sections">${P.sections.map(s => `<a href="#${s.id}">${s.nav}</a>`).join("")}</nav>
  </header>
  ${P.sections.map(s => `<section class="slide" id="${s.id}"><div class="slide-head"><h2>${s.title}</h2><span class="time">${s.time}</span></div>${s.blocks.map(block).join("")}</section>`).join("")}
  <footer>${P.footer.map(f => `<span>${f}</span>`).join("")}</footer>`;
chartQueue.forEach(([id, b]) => CHARTS[b.kind]($("#" + id), b.data, b.opts));
</script>
