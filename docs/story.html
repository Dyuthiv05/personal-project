027) change that math [6]."}]},{"type":"callout","title":"Problem statement","md":"**For which diabetic patients does adding a GLP-1 or SGLT2 drug pay for itself by preventing hospital stays, and what is that worth to a payer?** The client is a manufacturer building its value case for Medicare plans and health systems.","html":"<b>For which diabetic patients does adding a GLP-1 or SGLT2 drug pay for itself by preventing hospital stays, and what is that worth to a payer?</b> The client is a manufacturer building its value case for Medicare plans and health systems."},{"type":"say","md":"The client doesn't need to hear that diabetes is expensive. It needs a defensible answer to a payer's question: where does paying for this drug come back as fewer hospital stays?","html":"The client doesn't need to hear that diabetes is expensive. It needs a defensible answer to a payer's question: where does paying for this drug come back as fewer hospital stays?"},{"type":"refs","items":["<a href=\"https://www.cdc.gov/diabetes/php/data-research/index.html\">CDC, National Diabetes Statistics Report: At a glance</a>","<a href=\"https://diabetes.org/about-us/statistics/cost-diabetes\">American Diabetes Association, Economic Costs of Diabetes in the U.S. in 2022</a> (Parker et al., <i>Diabetes Care</i>)","<a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC8418292\">Rubin &amp; Shah, \"Predicting and Preventing Acute Care Re-Utilization by Patients with Diabetes,\" <i>Current Diabetes Reports</i>, 2021</a>","American Diabetes Association, Standards of Care in Diabetes, Section 9: Pharmacologic Approaches (<i>Diabetes Care</i> supplement)","<a href=\"https://doaj.org/article/241fc9acf8aa4641a972e8d294236447\">GLP-1 RA / SGLT2i use after new ASCVD diagnosis, 2018–2022, <i>BMJ Open Diabetes Research &amp; Care</i>, 2024</a>","<a href=\"https://cms.gov/files/document/fact-sheet-negotiated-prices-initial-price-applicability-year-2026.pdf\">CMS, Medicare negotiated prices for 2026</a> and <a href=\"https://www.healthcaredive.com/news/medicare-price-negotiation-wegovy-ozempic-trelegy-2027/806578/\">2027 (semaglutide)</a>"]}]},{"id":"approach","nav":"2 · Approach","title":"2 · Three questions, each feeding the next","time":"3:00 – 4:00","blocks":[{"type":"issues","items":[{"k":"A","q":"Who keeps coming back to hospital?","how":"<b>Hypothesis:</b> a small, identifiable group of diabetic patients drives repeat admissions. <b>Data:</b> 101,766 hospital stays (Kaggle). <b>Methods:</b> SQL profiling, penalized regression, random forest, neural network, decision-tree segments.","where":"Output → each patient's risk and hospital stays per year","verdict":"Confirmed"},{"k":"B","q":"What could change it, and what does it cost?","how":"<b>Hypothesis:</b> GLP-1 / SGLT2 drugs are the lever, but their price limits use. <b>Data:</b> CMS Part D 2013–2024 and 2020–2024 spending (my API pulls), CMS negotiated prices. <b>Methods:</b> same-source trend, cost per patient-year (gross vs. negotiated).","where":"Output → annual cost of treatment","verdict":"Confirmed"},{"k":"C","q":"Where does it pay for itself?","how":"<b>Hypothesis:</b> at negotiated prices, it pays for itself only for frequent hospital users. <b>Data:</b> A's admissions × B's costs × trial effect (EMPA-REG) × Medicare payment per admission (CMS 2024 inpatient data, my API pull), all converted to 2026 dollars with the BLS hospital price index (my API pull). <b>Methods:</b> break-even model, net value by group, sensitivity analysis.","where":"Output → the targeting rule, its value, and rule vs. model","verdict":"Confirmed, with limits"}]},{"type":"say","md":"Each part's output is the next part's input: A tells us how often each patient is in hospital, B tells us what a year of the drug costs, and C combines them with the trial effect to find where it pays for itself.","html":"Each part's output is the next part's input: A tells us how often each patient is in hospital, B tells us what a year of the drug costs, and C combines them with the trial effect to find where it pays for itself."}]},{"id":"data","nav":"3 · Data","title":"3 · One downloaded dataset, 4 API pulls, no patient identifiers","time":"4:00 – 5:00","blocks":[{"type":"p","md":"The hospital data describes the patients. My own API pulls (code in `src/apis.py`) supply what the drugs cost, how their use has changed, what a hospital stay costs Medicare, the price index that puts every dollar in 2026, and how drugs map to classes. A small file of sourced outside inputs (`reference/assumptions.csv`) supplies the trial effect and the negotiated prices.","html":"The hospital data describes the patients. My own API pulls (code in <span class=\"mono\">src/apis.py</span>) supply what the drugs cost, how their use has changed, what a hospital stay costs Medicare, the price index that puts every dollar in 2026, and how drugs map to classes. A small file of sourced outside inputs (<span class=\"mono\">reference/assumptions.csv</span>) supplies the trial effect and the negotiated prices."},{"type":"table","columns":[{"label":"Source","num":false},{"label":"How I got it","num":false},{"label":"Rows","num":true},{"label":"What it answers","num":false}],"rows":[["Kaggle · Diabetes 130-US Hospitals (1999–2008)","<span class=\"chip\">Downloaded</span>","101,766","Patients, stays, drugs and readmissions, 1999–2008"],["CMS Part D Prescribers by Geography & Drug, national, 2013–2024","<span class=\"chip\">My API pull</span>","1,404","National claims, fills and cost per drug, every year 2013–2024"],["CMS Medicare Inpatient Hospitals by Geography & Service (2024)","<span class=\"chip\">My API pull</span>","767","What a hospital stay costs Medicare, by type of stay (2024)"],["BLS CPI, inpatient hospital services (2017–2026)","<span class=\"chip\">My API pull</span>","115","Hospital price index, to put every dollar in 2026"],["NLM RxClass (ATC classes)","<span class=\"chip\">My API pull</span>","48","Drug → class mapping (ATC), shared by al public APIs, not scraped."}]},{"id":"partA","nav":"4 · A: Who","title":"4 · A: Repeat users are predictable: 26.5% readmitted with 3+ prior stays vs. 8.1% with none","time":"5:00 – 7:30","blocks":[{"type":"tiles","items":[{"value":"9.0%","label":"of 69,987 diabetic patients were back within 30 days","src":null},{"value":"11.7%","label":"had at least one other hospital stay in the past year","src":null},{"value":"18%","label":"had their blood sugar (A1C) checked during the stay","src":null},{"value":"40%","label":"of patients with a high A1C went home on unchanged diabetes meds","src":null}]},{"type":"cols","blocks":[{"type":"chart","kind":"hbars","title":"Prior hospital stays drive readmission","sub":"% readmitted within 30 days · dashed line = all patients","legend":null,"data":[{"label":"None","value":8.1,"tip":"<b>0 prior stays</b><br>8.1% readmitted<br>61,792 patients (88.3%)"},{"label":"1 prior stay","value":12.9,"tip":"<b>1 prior stays</b><br>12.9% readmitted<br>5,798 patients (8.3%)"},{"label":"2 prior stays","value":18.5,"tip":"<b>2 prior stays</b><br>18.5% readmitted<br>1,501 patients (2.1%)"},{"label":"3+ prior stays","value":26.5,"tip":"<b>3+ prior stays</b><br>26.5% readmitted<br>896 patients (1.3%)"}],"opts":{"labelW":120,"max":30,"ticks":[0,10,20,30],"tickFmt":{"suffix":"%"},"valFmt":{"d":1,"suffix":"%"},"ref":9.0}},{"type":"chart","kind":"hbars","title":"Hospital stays per year, by model risk decile","sub":"Stays in the past 12 months · dashed line = break-even at the negotiated SGLT2 price (1.04); orange = above it","legend":null,"data":[{"label":"Highest risk","value":1.77,"color":"s2","tip":"<b>Risk decile 10</b><br>1.77 stays in past 12 months<br>20.4% readmitted within 30 days<br>38.4% had a prior stay"},{"label":"Decile 9","value":1.43,"color":"s2","tip":"<b>Risk decile 9</b><br>1.43 stays in past 12 months<br>13.3% readmitted within 30 days<br>28.9% had a prior stay"},{"label":"Decile 8","value":1.24,"color":"s2","tip":"<b>Risk decile 8</b><br>1.24 stays in past 12 months<br>11.0% readmitted within 30 days<br>20.4% had a prior stay"},{"label":"Decile 7","value":1.15,"color":"s2","tip":"<b>Risk decile 7</b><br>1.15 stays in past 12 months<br>9.6% readmitted within 30 days<br>13.4% had a prior stay"},{"label":"Decile 6","value":1.09,"color":"s2","tip":"<b>Risk decile 6</b><br>1.09 stays in past 12 months<br>8.4% readmitted within 30 days<br>8.4% had a prior stay"},{"label":"Decile 5","value":1.04,"color":"s2","tip":"<b>Risk decile 5</b><br>1.04 stays in past 12 months<br>6.5% readmitted within 30 days<br>4.3% had a prior stay"},{"label":"Decile 4","value":1.02,"color":"s1","tip":"<b>Risk decile 4</b><br>1.02 stays in past 12 months<br>6.4% readmitted within 30 days<br>2.0% had a prior stay"},{"label":"Decile 3","value":1.01,"color":"s1","tip":"<b>Risk decile 3</b><br>1.01 stays in past 12 months<br>5.7% readmitted within 30 days<br>1.0% had a prior stay"},{"label":"Decile 2","value":1.0,"color":"s1","tip":"<b>Risk decile 2</b><br>1.00 stays in past 12 months<br>5.1% readmitted within 30 days<br>0.2% had a prior stay"},{"label":"Lowest risk","value":1.0,"color":"s1","tip":"<b>Risk decile 1</b><br>1.00 stays in past 12 months<br>3.3% readmitted within 30 days<br>0.0% had a prior stay"}],"opts":{"labelW":110,"rowH":22,"max":2.2,"ticks":[0,1,2],"tickFmt":{},"valFmt":{"d":2},"ref":1.04}}]},{"type":"table","columns":[{"label":"Model","num":false},{"label":"ROC-AUC","num":true},{"label":"PR-AUC","num":true},{"label":"Top-decile lift","num":true}],"rows":[["Penalized logistic (L1)","0.643","0.156","2.01×"],["Random forest <span class=\"chip\">best</span>","0.656","0.163","2.32×"],["Neural network (MLP)","0.635","0.150","2.00×"]],"highlight":1},{"type":"say","md":"History and destination predict a return far better than diagnosis: 3+ prior stays means 26.5% readmitted, and a nursing-facility discharge 15.1% vs. 6.9% home. Three models land at 0.64–0.66 AUC; the neural network adds nothing. What matters for the client is the right-hand chart: 6 of 10 risk deciles average more hospital stays than the drug needs to break even, and the top deciles clear it by the widest margin. And just 18% had an A1C test, so discharge is a missed moment to start treatment.","html":"History and destination predict a return far better than diagnosis: 3+ prior stays means 26.5% readmitted, and a nursing-facility discharge 15.1% vs. 6.9% home. Three models land at 0.64–0.66 AUC; the neural network adds nothing. What matters for the client is the right-hand chart: 6 of 10 risk deciles average more hospital stays than the drug needs to break even, and the top deciles clear it by the widest margin. And just 18% had an A1C test, so discharge is a missed moment to start treatment."}]},{"id":"partB","nav":"5 · B: Lever","title":"5 · B: The newer drugs went from 1.5% to 33% of claims, and price is the barrier","time":"7:30 – 9:30","blocks":[{"type":"chart","kind":"lines","title":"GLP-1 + SGLT2 share of Medicare diabetes drugs, 2013–2024 (same CMS file every year)","sub":null,"legend":[{"label":"Share of spending","color":"s2"},{"label":"Share of claims","color":"s1"}],"data":[{"name":"Share of spending","color":"s2","pts":[[2013,5.4],[2014,6.7],[2015,9.3],[2016,12.5],[2017,16.5],[2018,20.9],[2019,26.6],[2020,33.6],[2021,41.5],[2022,50.9],[2023,60.9],[2024,76.0]],"end":"76%"},{"name":"Share of claims","color":"s1","pts":[[2013,1.5],[2014,2.1],[2015,3.2],[2016,4.3],[2017,5.5],[2018,7.0],[2019,9.2],[2020,11.7],[2021,15.2],[2022,20.0],[2023,27.4],[2024,33.3]],"end":"33%"}],"opts":{"H":250,"ymax":100,"yticks":[0,25,50,75,100],"yFmt":{"suffix":"%"},"xticks":[2013,2016,2019,2022,2024],"xFmt":{},"tipFmt":{"d":1,"suffix":"%"}}},{"type":"chart","kind":"pairbars","title":"A year of treatment: gross 2024 Medicare cost vs. negotiated price","sub":"Trulicity and Mounjaro have no negotiated price yet","legend":[{"label":"Gross 2024 (CMS: cost ÷ 30-day fills × 12)","color":"s4"},{"label":"Medicare negotiated price × 12","color":"s1"}],"data":[{"label":"Ozempic (GLP-1)","values":[10840.0,3288.0],"tip":"<b>Ozempic</b><br>Gross 2024: $903 per 30 days, $10,840 a year<br>Negotiated: $274 per 30 days"},{"label":"Jardiance (SGLT2)","values":[6491.0,2364.0],"tip":"<b>Jardiance</b><br>Gross 2024: $541 per 30 days, $6,491 a year<br>Negotiated: $197 per 30 days"},{"label":"Mounjaro (GLP-1)","values":[12475.0,0],"tip":"<b>Mounjaro</b><br>Gross 2024: $1,040 per 30 days, $12,475 a year<br>No negotiated price yet"},{"label":"Trulicity (GLP-1)","values":[11381.0,0],"tip":"<b>Trulicity</b><br>Gross 2024: $948 per 30 days, $11,381 a year<br>No negotiated price yet"},{"label":"Farxiga (SGLT2)","values":[6460.0,2142.0],"tip":"<b>Farxiga</b><br>Gross 2024: $538 per 30 days, $6,460 a year<br>Negotiated: $178 per 30 days"},{"label":"Rybelsus (GLP-1)","values":[10989.0,3288.0],"tip":"<b>Rybelsus</b><br>Gross 2024: $916 per 30 days, $10,989 a year<br>Negotiated: $274 per 30 days"}],"opts":{"max":14000,"ticks":[0,5000,10000],"tickFmt":{"prefix":"$","div":1000,"suffix":"K"},"valFmt":{"prefix":"$","div":1000,"d":1,"suffix":"K"},"colors":["s4","s1"],"names":["Gross 2024","Negotiated"]}},{"type":"say","md":"In the 1999–2008 hospital data none of these drugs were used; the first GLP-1 arrived in 2005 and the first SGLT2 in 2013. From one consistent Medicare source, they went from 1.5% of claims in 2013 to 33% in 2024, while taking 76% of spending. A year of an SGLT2 costs about $6,481 gross today and $2,364 at the negotiated price. That price is the input to the next slide.","html":"In the 1999–2008 hospital data none of these drugs were used; the first GLP-1 arrived in 2005 and the first SGLT2 in 2013. From one consistent Medicare source, they went from 1.5% of claims in 2013 to 33% in 2024, while taking 76% of spending. A year of an SGLT2 costs about $6,481 gross today and $2,364 at the negotiated price. That price is the input to the next slide."}]},{"id":"partC","nav":"6 · C: Value","title":"6 · C: At negotiated prices it pays for itself once a patient has another stay in the past year","time":"9:30 – 12:30","blocks":[{"type":"p","md":"**The model, per patient-year:** admissions avoided = expected admissions × 11% (EMPA-REG trial); savings = avoided × $20,654, Medicare's 2024 average payment per admission in 2026 dollars; net value = savings − annual drug cost. Expected admissions = stays in the past 12 months from Part A. Only hospital savings are counted, so this is conservative.","html":"<b>The model, per patient-year:</b> admissions avoided = expected admissions × 11% (EMPA-REG trial); savings = avoided × $20,654, Medicare's 2024 average payment per admission in 2026 dollars; net value = savings − annual drug cost. Expected admissions = stays in the past 12 months from Part A. Only hospital savings are counted, so this is conservative."},{"type":"h3","md":"Reconciling the years","html":"Reconciling the years"},{"type":"table","columns":[{"label":"Input","num":false},{"label":"Data year","num":false},{"label":"How it's aligned","num":false},{"label":"Effect on the result","num":false}],"rows":[["Hospital stays per patient","1999–2008","Kept as a pattern; checked against recent readmission rates; 50% scenario","Likely understates value: readmissions in this data run below recent rates"],["Drug effect (11%)","2015 trial","Biological effect, not a price; range 4–18%","Neutral; real-world adherence could lower it"],["Cost of an admission","2024 (CMS), 2018 (HCUP)","Converted to 2026 $ with the BLS inpatient-hospital price index","Fixed: was understated by mixing 2018 costs with 2026 prices"],["Negotiated drug prices","2026 / 2027","Already the decision year","Neutral (GLP-1 price is one year later)"],["Gross drug cost","2024","Left in 2024 $, used only as a comparison scenario","Slightly understates gross cost if list prices rose"],["Use trend","2013–2024","One consistent CMS file every year","Context only"]]},{"type":"p","md":"Two independent sources agree once they' function showTip(e, html) { tip.innerHTML = html; tip.style.opacity = 1; tip.style.left = Math.min(e.clientX + 14, innerWidth - 270) + "px"; tip.style.top = (e.clientY + 14) + "px"; }
function hideTip() { tip.style.opacity = 0; }
function el(tag, attrs = {}, parent) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
function txt(parent, x, y, s, cls, extra = {}) { const t = el("text", { x, y, class: cls, ...extra }, parent); t.textContent = s; return t; }
function hover(node, html) { if (!html) return; node.addEventListener("pointermove", e => showTip(e, html)); node.addEventListener("pointerleave", hideTip); }

function hbars(svg, rows, o) {
  const W = 620, lw = o.labelW ?? 190, rh = o.rowH ?? 30, top = 6, H = top + rows.length * rh + 22;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const max = o.max, x = v => lw + (W - lw - 60) * v / max;
  o.ticks.forEach(t => { el("line", { x1: x(t), x2: x(t), y1: top, y2: H - 20, class: "gridl" }, svg); txt(svg, x(t), H - 6, F(t, o.tickFmt), "ax", { "text-anchor": "middle" }); });
  rows.forEach((r, i) => {
    const y = top + i * rh, bh = Math.min(16, rh - 10), w = Math.max(3, x(r.value) - lw);
    txt(svg, lw - 10, y + rh / 2 + 4, r.label, "lbl", { "text-anchor": "end" });
    el("path", { d: `M${lw},${y + (rh - bh) / 2} h${w - 3} a3,3 0 0 1 3,3 v${bh - 6} a3,3 0 0 1 -3,3 h${-(w - 3)} z`, fill: col(r.color ?? "s1") }, svg);
    txt(svg, lw + w + 6, y + rh / 2 + 4, F(r.value, o.valFmt), "val");
    hover(el("rect", { x: 0, y, width: W, height: rh, class: "hit" }, svg), r.tip);
  });
  if (o.ref != null) el("line", { x1: x(o.ref), x2: x(o.ref), y1: top - 2, y2: H - 20, class: "ref" }, svg);
  el("line", { x1: lw, x2: lw, y1: top, y2: H - 20, class: "base" }, svg);
}

}
function lines(svg, series, o) {
  const W = 620, H = o.H ?? 260, L = 44, R = 70, T = 12, B = 28;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const xs = series[0].pts.map(p => p[0]), xmin = Math.min(...xs), xmax = Math.max(...xs);
  const X = v => L + (W - L - R) * (v - xmin) / (xmax - xmin), Y = v => T + (H - T - B) * (1 - v / o.ymax);
  o.yticks.forEach(t => { el("line", { x1: L, x2: W - R, y1: Y(t), y2: Y(t), class: "gridl" }, svg); txt(svg, L - 8, Y(t) + 4, F(t, o.yFmt), "ax", { "text-anchor": "end" }); });
  (o.xticks ?? xs).forEach(t => txt(svg, X(t), H - 8, F(t, o.xFmt), "ax", { "text-anchor": "middle" }));
  el("line", { x1: L, x2: W - R, y1: Y(0), y2: Y(0), class: "base" }, svg);
  if (o.diag) el("line", { x1: X(xmin), y1: Y(0), x2: X(xmax), y2: Y(o.ymax), class: "ref" }, svg);
  series.forEach(s => {
    el("path", { d: s.pts.map((p, i) => (i ? "L" : "M") + X(p[0]) + "," + Y(p[1])).join(""), fill: "none", stroke: col(s.color), "stroke-width": 2.2, "stroke-linejoin": "round" }, svg);
    if (!o.noDots) s.pts.forEach(p => el("circle", { cx: X(p[0]), cy: Y(p[1]), r: 4, fill: col(s.color), stroke: "var(--panel)", "stroke-width": 2 }, svg));
    if (s.end) { const p = s.pts.at(-1); txt(svg, X(p[0]) + 8, Y(p[1]) + 4, s.end, "val"); }
  });
  (o.marks ?? []).forEach(m => { el("circle", { cx: X(m.x), cy: Y(m.y), r: 5, fill: col(m.color ?? "s2"), stroke: "var(--panel)", "stroke-width": 2 }, svg); txt(svg, X(m.x) + 10, Y(m.y) + 16, m.label, "val"); });
  const cross = el("line", { y1: T, y2: H - B, class: "ref", opacity: 0 }, svg);
  const hit = el("rect", { x: L, y: T, width: W - L - R, height: H - T - B, class: "hit" }, svg);
  hit.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect(), vx = xmin + (xmax - xmin) * (((e.clientX - r.left) * W / r.width) - L) / (W - L - R);
    const pts = series.map(s => s.pts.reduce((a, b) => Math.abs(b[0] - vx) < Math.abs(a[0] - vx) ? b : a));
    cross.setAttribute("x1", X(pts[0][0])); cross.setAttribute("x2", X(pts[0][0])); cross.setAttribute("opacity", 1);
    showTip(e, `<b>${F(pts[0][0], o.xFmt)}</b>` + series.map((s, i) => `<br>${s.name}: ${F(pts[i][1], o.tipFmt)}`).join(""));
  });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("opacity", 0); hideTip(); });
}
function scatter(svg, pts, o) {

  const X = v => L + (W - L - R) * (tx(v) - x0) / (x1 - x0), Y = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  o.yticks.forEach(t => { el("line", { x1: L, x2: W - R, y1: Y(t), y2: Y(t), class: "gridl" }, svg); txt(svg, L - 8, Y(t) + 4, F(t, o.yFmt), "ax", { "text-anchor": "end" }); });
  o.xticks.forEach(t => txt(svg, X(t), H - 22, F(t, o.xFmt), "ax", { "text-anchor": "middle" }));

  el("line", { x1: L, x2: W - R, y1: H - B, y2: H - B, class: "base" }, svg);
  if (o.refY != null) el("line", { x1: L, x2: W - R, y1: Y(o.refY), y2: Y(o.refY), class: "ref" }, svg);
  if (o.refX != null) el("line", { x1: X(o.refX), x2: X(o.refX), y1: T, y2: H - B, class: "ref" }, svg);
  [...pts].sort((a, b) => b.r - a.r).forEach(p => hover(el("circle", { cx: X(p.x), cy: Y(p.y), r: p.r, fill: col(p.color), "fill-opacity": 0.85, stroke: "var(--panel)", "stroke-width": 2 }, svg), p.tip));
  pts.filter(p => p.showLabel).forEach(p => txt(svg, X(p.x) + (p.dx ?? p.r + 4), Y(p.y) + (p.dy ?? 4), p.label, "lbl", { "text-anchor": p.anchor ?? "start" }));
}
function hgroup(svg, rows, o) {
  const W = 620, lw = o.labelW ?? 150, n = o.names.length, bh = 11, rh = n * (bh + 3) + 14, top = 4, H = top + rows.length * rh + 24;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const [lo, hi] = o.dom, x = v => lw + (W - lw - 70) * (v - lo) / (hi - lo);
  o.ticks.forEach(t => { el("line", { x1: x(t), x2: x(t), y1: top, y2: H - 22, class: t === 0 ? "base" : "gridl" }, svg); txt(svg, x(t), H - 8, F(t, o.tickFmt), "ax", { "text-anchor": "middle" }); });
  rows.forEach((r, i) => {
    const y = top + i * rh;
    txt(svg, lw - 10, y + rh / 2 + 2, r.label, "lbl", { "text-anchor": "end" });
    r.values.forEach((v, j) => {
      const yy = y + 6 + j * (bh + 3), x0 = x(Math.min(0, v)), w = Math.max(1.5, Math.abs(x(v) - x(0)));
      el("rect", { x: x0, y: yy, width: w, height: bh, rx: 2, fill: col(o.colors[j]) }, svg);
      txt(svg, v >= 0 ? x(v) + 5 : x(v) - 5, yy + 9, F(v, o.valFmt), "ax", { "text-anchor": v >= 0 ? "start" : "end" });
    });
    hover(el("rect", { x: 0, y, width: W, height: rh, class: "hit" }, svg), r.tip);
  });
}
function tornado(svg, rows, o) {
  const W = 620, lw = o.labelW ?? 230, rh = 34, top = 18, H = top + rows.length * rh + 24;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const [lo, hi] = o.dom, x = v => lw + (W - lw - 20) * (v - lo) / (hi - lo);
  o.ticks.forEach(t => { el("line", { x1: x(t), x2: x(t), y1: top, y2: H - 22, class: t === 0 ? "base" : "gridl" }, svg); txt(svg, x(t), H - 8, F(t, o.tickFmt), "ax", { "text-anchor": "middle" }); });
  el("line", { x1: x(o.base), x2: x(o.base), y1: top - 10, y2: H - 22, class: "ref" }, svg);
  txt(svg, x(o.base), top - 12, "base case " + F(o.base, o.tickFmt), "ax", { "text-anchor": "middle" });
  rows.forEach((r, i) => {
    const y = top + i * rh, a = Math.min(r.low, r.high), b = Math.max(r.low, r.high);
    txt(svg, lw - 10, y + rh / 2 + 4, r.label, "lbl", { "text-anchor": "end" });
    el("rect", { x: x(a), y: y + 8, width: Math.max(2, x(b) - x(a)), height: rh - 16, rx: 3, fill: col(a < 0 ? "s2" : "s1"), "fill-opacity": 0.85 }, svg);
    txt(svg, x(a) - 5, y + rh / 2 + 4, F(r.low, o.tickFmt), "ax", { "text-anchor": "end" });
    txt(svg, x(b) + 5, y + rh / 2 + 4, F(r.high, o.tickFmt), "ax");
    hover(el("rect", { x: 0, y, width: W, height: rh, class: "hit" }, svg), r.tip);
  });
}
const CHARTS = { hbars, pairbars, lines, scatter, hgroup, tornado };

/* ---------- blocks ---------- */
const legend = items => items ? `<div class="legend">${items.map(i => `<span><i style="background:${col(i.color)}"></i>${i.label}</span>`).join("")}</div>` : "";
function tableHTML(b) {
  return `<div class="tbl-wrap"><table class="${b.dense ? "data" : ""}"><thead><tr>${b.columns.map(c => `<th class="${c.num ? "n" : ""}">${c.label}</th>`).join("")}</tr></thead><tbody>${
    b.rows.map((r, i) => `<tr class="${b.highlight === i ? "best" : ""}">${r.map((v, j) => `<td class="${b.columns[j].num ? "n" : ""}${String(v).startsWith("hidden by CMS") ? " sup" : ""}${b.columns[j].ok ? " ok" : ""}">${v}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
let chartQueue = [], viewers = [];
function block(b) {
  switch (b.type) {
    case "p": return `<p class="${b.cls ?? ""}">${b.html}</p>`;
    case "h3": return `<h3>${b.html}</h3>`;
    case "callout": return `<div class="callout ${b.plain ? "plain" : ""}">${b.title ? `<span class="t">${b.title}</span>` : ""}<p>${b.html}</p></div>`;
    case "appendix": return "";
    case "say": return `<div class="say"><b>Say:</b> ${b.html}</div>`;
    case "list": return `<div class="how">${b.title ? `<h3>${b.title}</h3>` : ""}<ul>${b.items.map(i => `<li>${i}</li>`).join("")}</ul></div>`;
    case "text": return `<div class="how"><h3>${b.title}</h3><p>${b.html}</p></div>`;
    case "tiles": return `<div class="tiles">${b.items.map(t => `<div class="tile"><span class="v">${t.value}</span><span class="l">${t.label}</span>${t.src ? `<span class="stat-src">${t.src}</span>` : ""}</div>`).join("")}</div>`;
    case "cols": return `<div class="grid2">${b.blocks.map(block).join("")}</div>`;
    case "table": return tableHTML(b);
    case "chart": { const id = "c" + chartQueue.length; chartQueue.push([id, b]);
      return `<div class="chart"><h3>${b.title}</h3>${b.sub ? `<span class="sub">${b.sub}</span>` : ""}${legend(b.legend)}<svg id="${id}"></svg></div>`; }
    case "issues": return `<div class="issue">${b.items.map(q => `<div class="issue-q"><span class="k">${q.k}</span><b>${q.q}</b><span class="m">${q.how}</span><span class="m">${q.where}${q.verdict ? ` <span class="verdict ${q.ok === false ? "no" : ""}">${q.verdict}</span>` : ""}</span></div>`).join("")}</div>`;
    case "refs": return `<div class="refs"><span>Sources</span><ol>${b.items.map(r => `<li>${r}</li>`).join("")}</ol></div>`;
    case "flow": return `<div class="flow">${b.nodes.map(n => `<div class="node ${n.downloaded ? "dl" : ""}"><span class="k">${n.k}</span><b>${n.title}</b><span>${n.text}</span></div>`).join("")}</div>
      <div class="joins">${b.joins.map(j => `<div><span>${j.key}</span><span>${j.text}</span></div>`).join("")}</div>`;
    case "viewer": { const id = "v" + viewers.length; viewers.push([id, b]);
      return `<div class="tabs" role="tablist" id="${id}-tabs"></div><div class="viewer" id="${id}" role="tabpanel"></div>`; }
    case "privacy": return `<div class="privacy"><h3>${b.title}</h3><p>${b.html}</p>${tableHTML(b.table)}<div class="how"><ul>${b.bullets.map(x => `<li>${x}</li>`).join("")}</ul></div></div>`;
    case "reco": return `<div class="reco">${b.items.map((r, i) => `<div class="reco-item"><span class="k">${i + 1}</span><div><h3>${r.k}</h3><p>${r.html}</p></div></div>`).join("")}</div>`;
    case "limits": return `<div class="limits">${b.cols.map(c => `<div><h3>${c.title}</h3><ul>${c.items.map(i => `<li>${i}</li>`).join("")}</ul></div>`).join("")}</div>`;
    default: return `<p>Unknown block type: ${b.type}</p>`;
  }
}
function renderViewer(id, b, t) {
  for (const btn of $(`#${id}-tabs`).children) btn.setAttribute("aria-selected", +btn.dataset.i === t);
  const tab = b.tabs[t];
  $("#" + id).innerHTML = `<dl class="kv">${tab.kv.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    ${tab.groups ? `<div class="groups">${tab.groups.map(g => `<div><b>${g.name}</b><span>${g.cols}</span></div>`).join("")}</div>` : ""}
    ${tableHTML({ ...tab.table, dense: true })}
    ${(tab.after ?? []).map(a => a.code ? `<pre class="code">${a.code}</pre>` : `<p class="stat-src">${a.html}</p>`).join("")}`;
}

/* ---------- page ---------- */
const P = PAGE;
$("#page").innerHTML = `
  <header class="hero">
    <span class="eyebrow">${P.eyebrow}</span><h1>${P.title}</h1><p class="lede">${P.lede}</p>
    <p class="opener">${P.opener}<small>${P.opener_note}</small></p>
    <nav class="agenda" aria-label="Sections">${P.sections.map(s => `<a href="#${s.id}">${s.nav}</a>`).join("")}</nav>
  </header>
  ${P.sections.map(s => (s.appendix_start ? `<div class="appendix-head"><span class="eyebrow">Appendix</span><p>${P.appendix_note}</p></div>` : "") +
    `<section class="slide" id="${s.id}"><div class="slide-head"><h2>${s.title}</h2><span class="time">${s.time}</span></div>${s.blocks.map(block).join("")}</section>`).join("")}
  <footer>${P.footer.map(f => `<span>${f}</span>`).join("")}</footer>`;
chartQueue.forEach(([id, b]) => CHARTS[b.kind]($("#" + id), b.data, b.opts));
viewers.forEach(([id, b]) => {
  $(`#${id}-tabs`).innerHTML = b.tabs.map((t, i) => `<button type="button" role="tab" data-i="${i}" aria-selected="false">${t.label}</button>`).join("");
  for (const btn of $(`#${id}-tabs`).children) btn.addEventListener("click", () => renderViewer(id, b, +btn.dataset.i));
  renderViewer(id, b, 0);
});
</script>
